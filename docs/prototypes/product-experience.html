<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insight Agent Platform · 产品体验原型 / Reference Only</title>
    <style>
      :root {
        --bg: #f4ede3;
        --panel: rgba(255, 250, 244, 0.88);
        --panel-strong: #fff7ef;
        --line: rgba(58, 38, 18, 0.12);
        --line-strong: rgba(58, 38, 18, 0.24);
        --ink: #2f2113;
        --muted: #6d5b4b;
        --accent: #0f766e;
        --accent-deep: #0a4b47;
        --accent-soft: #d9f0eb;
        --signal: #bf5f2f;
        --signal-soft: #f4e0d1;
        --risk-high: #a43c2d;
        --risk-high-soft: #f7ddd8;
        --risk-medium: #ad6c17;
        --risk-medium-soft: #f6ead6;
        --success: #2a6f4f;
        --success-soft: #dcefe4;
        --shadow: 0 24px 60px rgba(58, 38, 18, 0.12);
        --radius-xl: 28px;
        --radius-lg: 20px;
        --radius-md: 14px;
        --radius-sm: 999px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        color: var(--ink);
        font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        background:
          radial-gradient(circle at top left, rgba(15, 118, 110, 0.14), transparent 28%),
          radial-gradient(circle at top right, rgba(191, 95, 47, 0.12), transparent 26%),
          linear-gradient(180deg, #fbf5ed 0%, #f0e6d9 100%);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(58, 38, 18, 0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(58, 38, 18, 0.04) 1px, transparent 1px);
        background-size: 28px 28px;
        mask-image: linear-gradient(180deg, rgba(0, 0, 0, 0.2), transparent 70%);
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      .prototype-notice {
        margin: 18px 18px 0;
        padding: 14px 18px;
        border: 1px solid rgba(15, 118, 110, 0.18);
        border-radius: 18px;
        background: rgba(255, 247, 239, 0.94);
        box-shadow: 0 12px 32px rgba(58, 38, 18, 0.08);
        color: var(--ink);
      }

      .prototype-notice strong {
        color: var(--accent-deep);
      }

      .prototype-notice code {
        font-family: "SFMono-Regular", ui-monospace, "Cascadia Code", "Source Code Pro", monospace;
        font-size: 12px;
      }

      .app-shell {
        position: relative;
        display: grid;
        grid-template-columns: 248px minmax(0, 1fr) 296px;
        gap: 18px;
        min-height: 100vh;
        padding: 18px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: var(--radius-xl);
        background: var(--panel);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .sidebar,
      .inspector {
        position: sticky;
        top: 18px;
        height: calc(100vh - 36px);
        overflow: auto;
      }

      .sidebar {
        padding: 22px;
      }

      .brand {
        margin-bottom: 20px;
      }

      .brand-kicker {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: var(--radius-sm);
        background: rgba(15, 118, 110, 0.08);
        color: var(--accent-deep);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .brand h1,
      .page-title,
      .section-title,
      .inspector-title,
      .hero-value {
        font-family: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      }

      .brand h1 {
        margin: 14px 0 10px;
        font-size: 30px;
        line-height: 1.04;
      }

      .brand p {
        margin: 0;
        color: var(--muted);
        line-height: 1.6;
      }

      .workspace-chip {
        padding: 18px;
        border-radius: var(--radius-lg);
        background:
          linear-gradient(135deg, rgba(15, 118, 110, 0.12), rgba(15, 118, 110, 0.04)),
          var(--panel-strong);
        border: 1px solid rgba(15, 118, 110, 0.14);
      }

      .workspace-chip h2 {
        margin: 0 0 6px;
        font-size: 22px;
      }

      .workspace-chip p {
        margin: 0;
        color: var(--muted);
        line-height: 1.55;
      }

      .workspace-chip.compact {
        padding: 14px 16px;
      }

      .workspace-chip.compact h2 {
        font-size: 18px;
      }

      .workspace-actions,
      .sidebar-filter-list {
        display: grid;
        gap: 8px;
      }

      .workspace-action-button,
      .nav-return-button,
      .sidebar-filter-button {
        width: 100%;
        min-height: 40px;
        padding: 0 14px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.74);
        color: var(--ink);
        text-align: left;
        cursor: pointer;
        transition: 160ms ease;
      }

      .workspace-action-button:hover,
      .workspace-action-button:focus-visible,
      .nav-return-button:hover,
      .nav-return-button:focus-visible,
      .sidebar-filter-button:hover,
      .sidebar-filter-button:focus-visible {
        border-color: rgba(15, 118, 110, 0.24);
        background: rgba(15, 118, 110, 0.1);
        outline: none;
      }

      .sidebar-filter-button.active {
        border-color: rgba(15, 118, 110, 0.28);
        background:
          linear-gradient(135deg, rgba(15, 118, 110, 0.14), rgba(15, 118, 110, 0.04)),
          rgba(255, 255, 255, 0.76);
      }

      .sidebar-search-wrap {
        margin-top: 18px;
      }

      .sidebar-search {
        width: 100%;
        min-height: 42px;
        padding: 0 14px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.78);
        color: var(--ink);
      }

      .sidebar-search:focus {
        outline: none;
        border-color: rgba(15, 118, 110, 0.24);
        box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.08);
      }

      .chip-row,
      .meta-row,
      .entry-row,
      .quick-grid,
      .fact-grid,
      .page-grid,
      .stats-grid,
      .flow-strip,
      .action-stack {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 7px 12px;
        border-radius: var(--radius-sm);
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.66);
        color: var(--muted);
        font-size: 12px;
        font-weight: 600;
      }

      .chip strong {
        color: var(--ink);
      }

      .nav-group {
        margin-top: 22px;
      }

      .nav-group.featured {
        margin-top: 24px;
        padding: 14px;
        border-radius: 18px;
        border: 1px solid rgba(15, 118, 110, 0.16);
        background:
          linear-gradient(135deg, rgba(15, 118, 110, 0.1), rgba(15, 118, 110, 0.03)),
          rgba(255, 255, 255, 0.58);
      }

      .nav-group h3 {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .nav-group-copy,
      .module-copy {
        margin: -4px 0 12px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .nav-button {
        width: 100%;
        padding: 14px 16px;
        border: 1px solid transparent;
        border-radius: 18px;
        background: transparent;
        color: var(--ink);
        text-align: left;
        cursor: pointer;
        transition: 160ms ease;
      }

      .nav-button + .nav-button {
        margin-top: 6px;
      }

      .nav-button:hover,
      .nav-button:focus-visible {
        border-color: rgba(15, 118, 110, 0.24);
        background: rgba(15, 118, 110, 0.08);
        outline: none;
      }

      .nav-button.active {
        border-color: rgba(15, 118, 110, 0.28);
        background:
          linear-gradient(135deg, rgba(15, 118, 110, 0.16), rgba(15, 118, 110, 0.04)),
          rgba(255, 255, 255, 0.6);
      }

      .nav-button small {
        display: block;
        margin-top: 5px;
        color: var(--muted);
      }

      .nav-button strong {
        display: block;
        font-size: 15px;
      }

      .nav-button .nav-caption,
      .nav-button .nav-meta {
        display: block;
        margin-top: 5px;
        color: var(--muted);
      }

      .nav-button .nav-meta {
        font-size: 12px;
      }

      .module-nav-header {
        margin: 18px 0 12px;
      }

      .module-nav-header h2 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      .nav-list-note {
        margin: 0 0 10px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.6;
      }

      .content {
        min-width: 0;
        padding: 22px;
      }

      .page-header {
        display: grid;
        gap: 18px;
        padding: 24px;
        border-radius: var(--radius-xl);
        background:
          linear-gradient(135deg, rgba(15, 118, 110, 0.14), transparent 58%),
          linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(255, 249, 242, 0.92));
        border: 1px solid rgba(15, 118, 110, 0.16);
      }

      .page-title {
        margin: 0;
        font-size: 38px;
        line-height: 1.05;
      }

      .page-subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.7;
      }

      .flow-card,
      .stat-card,
      .fact-card,
      .content-card,
      .timeline-item,
      .entry-card,
      .message,
      .aside-card {
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        background: rgba(255, 255, 255, 0.72);
      }

      .flow-card {
        min-width: 136px;
        padding: 12px 14px;
      }

      .flow-card strong {
        display: block;
        margin-bottom: 4px;
      }

      .flow-card.active {
        border-color: rgba(15, 118, 110, 0.24);
        background: rgba(15, 118, 110, 0.12);
      }

      .section {
        margin-top: 22px;
        padding: 24px;
      }

      .section-head {
        display: flex;
        justify-content: space-between;
        gap: 16px;
        align-items: flex-start;
        margin-bottom: 18px;
      }

      .section-title {
        margin: 0;
        font-size: 28px;
      }

      .section-copy {
        margin: 8px 0 0;
        max-width: 760px;
        color: var(--muted);
        line-height: 1.68;
      }

      .stats-grid,
      .fact-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .page-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .stat-card,
      .fact-card,
      .content-card,
      .aside-card,
      .entry-card {
        padding: 18px;
      }

      .label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .hero-value {
        margin: 0;
        font-size: 34px;
        line-height: 1.04;
      }

      .fact-card h4,
      .content-card h4,
      .aside-card h4,
      .entry-card h4,
      .timeline-item h4,
      .message h4 {
        margin: 0 0 10px;
        font-size: 20px;
      }

      .soft-list,
      .tight-list {
        margin: 0;
        padding-left: 18px;
      }

      .soft-list li,
      .tight-list li {
        margin: 8px 0;
        line-height: 1.6;
      }

      .tight-list li {
        margin: 6px 0;
      }

      .muted {
        color: var(--muted);
      }

      .tag {
        display: inline-flex;
        align-items: center;
        padding: 5px 10px;
        border-radius: var(--radius-sm);
        font-size: 12px;
        font-weight: 700;
      }

      .tag.status-completed {
        background: var(--success-soft);
        color: var(--success);
      }

      .tag.status-running {
        background: var(--accent-soft);
        color: var(--accent-deep);
      }

      .tag.status-failed {
        background: var(--risk-high-soft);
        color: var(--risk-high);
      }

      .tag.risk-high {
        background: var(--risk-high-soft);
        color: var(--risk-high);
      }

      .tag.risk-medium {
        background: var(--risk-medium-soft);
        color: var(--risk-medium);
      }

      .tag.risk-low {
        background: rgba(42, 111, 79, 0.14);
        color: var(--success);
      }

      .entry-card {
        background: linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(255, 246, 238, 0.9));
      }

      .entry-row {
        align-items: center;
      }

      .action-button,
      .ghost-button,
      .range-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        min-height: 40px;
        padding: 0 16px;
        border-radius: 14px;
        border: 1px solid transparent;
        cursor: pointer;
        transition: 160ms ease;
      }

      .action-button {
        background: var(--accent);
        color: #fff;
      }

      .action-button:hover,
      .action-button:focus-visible {
        background: var(--accent-deep);
        outline: none;
      }

      .ghost-button,
      .range-button {
        background: rgba(255, 255, 255, 0.72);
        border-color: var(--line);
        color: var(--ink);
      }

      .ghost-button:hover,
      .ghost-button:focus-visible,
      .range-button:hover,
      .range-button:focus-visible {
        border-color: rgba(15, 118, 110, 0.24);
        background: rgba(15, 118, 110, 0.1);
        outline: none;
      }

      .range-button.active {
        background: var(--signal-soft);
        border-color: rgba(191, 95, 47, 0.22);
        color: var(--signal);
      }

      .entry-meta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 10px;
        border-radius: var(--radius-sm);
        background: rgba(255, 255, 255, 0.88);
        border: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }

      .entry-meta strong {
        color: var(--ink);
      }

      .analysis-layout {
        display: grid;
        grid-template-columns: 208px minmax(0, 1.45fr) 220px;
        gap: 16px;
      }

      .conversation-list button,
      .report-list button {
        width: 100%;
        margin-top: 10px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: rgba(255, 255, 255, 0.76);
        cursor: pointer;
        text-align: left;
      }

      .conversation-list button.active,
      .report-list button.active {
        border-color: rgba(15, 118, 110, 0.24);
        background: rgba(15, 118, 110, 0.12);
      }

      .message-stack {
        display: grid;
        gap: 14px;
      }

      .message {
        padding: 18px;
      }

      .message.assistant {
        border-color: rgba(15, 118, 110, 0.18);
      }

      .message.user {
        border-color: rgba(191, 95, 47, 0.18);
      }

      .message-role {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .message p,
      .content-card p,
      .aside-card p,
      .fact-card p {
        margin: 0;
        line-height: 1.72;
      }

      .run-summary {
        margin-top: 16px;
        padding: 16px;
        border-radius: 18px;
        background: rgba(15, 118, 110, 0.08);
        border: 1px solid rgba(15, 118, 110, 0.16);
      }

      .run-summary-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
        margin-top: 14px;
      }

      .summary-mini {
        padding: 12px;
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.74);
        border: 1px solid rgba(15, 118, 110, 0.14);
      }

      .summary-mini strong,
      .timeline-item strong,
      .stat-card strong {
        display: block;
        margin-bottom: 4px;
        font-size: 13px;
        color: var(--muted);
      }

      .summary-mini span,
      .timeline-item span,
      .stat-card span {
        font-size: 15px;
        font-weight: 700;
      }

      .composer {
        display: grid;
        gap: 12px;
        margin-top: 16px;
      }

      .composer textarea {
        width: 100%;
        min-height: 92px;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.86);
        resize: vertical;
        color: var(--ink);
      }

      .timeline {
        display: grid;
        gap: 12px;
      }

      .timeline-item {
        padding: 16px;
      }

      .table-list {
        display: grid;
        gap: 10px;
      }

      .table-row {
        display: grid;
        grid-template-columns: minmax(0, 1.4fr) repeat(3, minmax(0, 1fr));
        gap: 12px;
        padding: 14px 16px;
        border-radius: 16px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.74);
      }

      .table-row > div {
        min-width: 0;
      }

      .table-row strong {
        display: block;
        font-size: 13px;
        color: var(--muted);
        margin-bottom: 4px;
      }

      .table-row span {
        display: block;
        font-size: 15px;
        font-weight: 700;
        word-break: break-word;
      }

      .inspector {
        padding: 22px;
      }

      .inspector-title {
        margin: 0;
        font-size: 28px;
      }

      .inspector-block + .inspector-block {
        margin-top: 18px;
      }

      .inspector-card {
        padding: 16px;
        border-radius: 18px;
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.72);
      }

      .ids-grid {
        display: grid;
        gap: 8px;
      }

      .ids-grid code {
        display: block;
        padding: 10px 12px;
        border-radius: 12px;
        background: rgba(47, 33, 19, 0.06);
        color: var(--ink);
        font-size: 12px;
        word-break: break-all;
      }

      .placeholder-note {
        padding: 18px;
        border-radius: 18px;
        background: rgba(191, 95, 47, 0.08);
        border: 1px solid rgba(191, 95, 47, 0.16);
      }

      .note {
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(15, 118, 110, 0.08);
        border: 1px solid rgba(15, 118, 110, 0.14);
        color: var(--muted);
      }

      @media (max-width: 1360px) {
        .app-shell {
          grid-template-columns: 236px minmax(0, 1fr);
        }

        .inspector {
          grid-column: 1 / -1;
          position: static;
          height: auto;
        }

        .stats-grid,
        .fact-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 1120px) {
        .analysis-layout,
        .page-grid {
          grid-template-columns: 1fr;
        }

        .table-row {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }

      @media (max-width: 860px) {
        .app-shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          position: static;
          height: auto;
        }

        .content {
          padding: 18px;
        }

        .stats-grid,
        .fact-grid,
        .run-summary-grid,
        .table-row {
          grid-template-columns: 1fr;
        }

        .page-title {
          font-size: 32px;
        }
      }
    </style>
  </head>
  <body>
    <div class="prototype-notice">
      <strong>Product Experience Prototype / Reference Only</strong>
      <div>本文件仅作为产品体验原型、用户流程参考和可点击验证稿，不是正式事实源。</div>
      <div>正式事实源以 <code>AGENTS.md</code>、<code>docs/**</code>、<code>packages/contracts/**</code> 为准。</div>
    </div>
    <div class="app-shell">
      <aside class="sidebar panel" id="sidebar-root"></aside>
      <main class="content panel" id="page-root"></main>
      <aside class="inspector panel" id="inspector-root"></aside>
    </div>

    <script>
      const workspace = {
        workspaceId: "workspace-cn-retail",
        name: "Northstar Retail China",
        role: "Strategy Lead",
        businessDomain: "零售经营分析",
        dataSourceCount: 8,
        metricCount: 26,
        modelToolCount: 12,
        memberCount: 14
      };

      const pageMeta = {
        workspace: {
          title: "Workspace 当前空间",
          hero: "先确认当前企业空间，再进入具体分析页面。",
          objects: ["Workspace", "User", "Role", "BusinessDomain"],
          responsibility:
            "定义当前 Workspace、角色边界、业务域和能力总览；Dashboard、Analysis、Reports 等页面都在这个空间内工作。",
          notFor: "不承载 Finding 分析过程，不承载 Run Trace 详情。"
        },
        dashboard: {
          title: "Dashboard",
          hero: "按时间范围发现问题，把 Finding / Anomaly 分发到正确页面。",
          objects: ["Finding", "Anomaly", "Time Window"],
          responsibility:
            "展示当前时间窗口内的问题、影响、证据摘要和来源，并提供进入 Analysis、Metrics、Data & Knowledge、Platform Operations 的入口。",
          notFor: "不展示完整分析过程，不阅读正式报告，不承载 Run Trace 详情。"
        },

      }

      function getSelectedMetric() {
        return findMetric(state.selectedMetricId) || metrics[0];
      }

      function getSelectedEvidence() {
        return (
          findSourceEvidence(state.selectedSourceEvidenceId) || dataKnowledge.sourceEvidence[0]
        );
      }

      function getSelectedModelConfig() {
        return findModelConfig(state.selectedModelConfigId) || modelTools.modelConfigs[0];
      }

      function getFilteredGlobalNavGroups() {
        const term = normalizeSearch(state.globalSearch);

        return globalNavGroups
          .map((group) => {
            if (!term) {
              return group;
            }

            const filteredItems = group.items.filter((item) => {
              const meta = pageMeta[item.page];
              return (
                meta.title.toLowerCase().includes(term) ||
                item.caption.toLowerCase().includes(term) ||
                group.label.toLowerCase().includes(term)
              );
            });

            return {
              ...group,
              items: filteredItems
            };
          })
          .filter((group) => group.items.length > 0);
      }

      function getAnalysisNavConversations() {
        const term = normalizeSearch(state.analysisSearch);

        return analysisModuleConversationIds
          .map((conversationId) => findConversation(conversationId))
          .filter(Boolean)
          .filter((conversation) => {
            if (!term) {
              return true;
            }

            return conversation.title.toLowerCase().includes(term);
          });
      }

      function getReportsByFilter(filter) {
        if (filter === "all") {
          return reports;
        }

        return reports.filter((report) => report.reportStatus === filter);
      }

      function getVisibleReports() {
        return getReportsByFilter(state.reportFilter);
      }

      function parseCost(costText) {
        return Number(costText.replace(/[^\d.]/g, "")) || 0;
      }

      function getObservabilityGroups() {
        const runs = Object.values(runDetails);
        const recentOrder = ["run-margin-411", "run-roi-221", "run-gmv-8841"];
        const recentRuns = recentOrder.map((runId) => runDetails[runId]).filter(Boolean);
        const failedRuns = runs.filter((run) => run.status === "failed");
        const highCostRuns = [...runs]
          .sort((left, right) => parseCost(right.cost) - parseCost(left.cost))
          .slice(0, 3);

        return [
          {
            title: "最近 Run",
            copy: "直接从全局导航进入时，先看到近期运行，再决定进入具体 Trace。",
            runs: recentRuns
          },
          {
            title: "失败 Run",
            copy: "快速定位需要排障或补跑的后台执行。",
            runs: failedRuns
          },
          {
            title: "高成本 Run",
            copy: "优先关注成本占用高的分析链路。",
            runs: highCostRuns
          }
        ];
      }

      function syncSelectionFromFinding(finding) {
        if (!finding) {
          return;
        }

        state.selectedFindingId = finding.findingId;
        state.selectedConversationId = finding.conversationId;
        state.selectedRunId = finding.runId;
        state.selectedReportId = finding.reportId;
        state.selectedMetricId = finding.metricId;
        state.selectedSourceEvidenceId = finding.sourceEvidenceId;
      }

      function syncSelectionFromConversation(conversation) {
        if (!conversation) {
          return;
        }

        state.selectedConversationId = conversation.conversationId;
        state.selectedRunId = conversation.selectedRunId;
        state.selectedReportId = conversation.reportId;
        state.selectedMetricId = conversation.metricId;
        state.selectedSourceEvidenceId = conversation.sourceEvidenceId;
        state.selectedModelConfigId = conversation.modelConfigId;
      }

      function syncSelectionFromRun(run) {
        if (!run) {
          return;
        }

        state.selectedRunId = run.runId;
        state.selectedReportId = run.reportId;
        state.selectedMetricId = run.metricId;
        state.selectedSourceEvidenceId = run.sourceEvidenceId;
        state.selectedModelConfigId = run.modelConfigId;
      }

      function buildAction(actionId, context = {}) {
        switch (actionId) {
          case "openPage": {
            const meta = pageMeta[context.page];
            const navItem = getGlobalNavItem(context.page) || {
              reason: "从当前页面打开对应的配置或占位入口。",
              type: "配置入口"
            };

            return {
              label: meta.title,
              targetPage: context.page,
              targetLabel: meta.title,
              reason: navItem.reason,
              type: navItem.type,
              apply() {
                state.currentPage = context.page;
                state.navMode =
                  context.page === "analysis"
                    ? "analysis"
                    : context.page === "reports"
                      ? "reports"
                      : "global";
                if (context.page === "reports") {
                  state.reportFilter = "all";
                }
              }
            };
          }

          case "openDashboard":
            return {
              label: "进入 Dashboard",
              targetPage: "dashboard",
              targetLabel: "Dashboard",
              reason: "从当前 Workspace 进入 Finding / Anomaly 发现层。",
              type: "主流程",
              apply() {
                state.currentPage = "dashboard";
                state.navMode = "global";
                syncSelectionFromFinding(getFindings()[0]);
              }
            };

          case "selectRange":
            return {
              label: `切换到 ${getTimeRangeLabel(context.range)}`,
              targetPage: "dashboard",
              targetLabel: "Dashboard",
              reason: "切换时间窗口，查看该范围内的 Finding / Anomaly。",
              type: "主流程",
              apply() {
                state.currentPage = "dashboard";
                state.navMode = "global";
                state.timeRange = context.range;
                syncSelectionFromFinding(getFindings()[0]);
              }
            };

          case "analyzeFinding": {
            const finding = findFinding(context.findingId);

            return {
              label: "分析这个问题",
              targetPage: "analysis",
              targetLabel: "Analysis",
              reason: "基于当前 Finding 创建 / 打开带上下文的 Conversation。",
              type: "主流程",
              apply() {
                const targetConversation =
                  findConversation(finding.conversationId) || findConversation("conv-gmv-east");
                state.currentPage = "analysis";
                state.navMode = "analysis";
                syncSelectionFromFinding(finding);
                syncSelectionFromConversation(targetConversation);
              }
            };
          }

          case "openBlankConversation": {
            const conversation = findConversation("conv-blank-roi");

            return {
              label: "新建空白会话",
              targetPage: "analysis",
              targetLabel: "Analysis",
              reason: "不带 Dashboard Finding，直接进入空白会话主动提问。",
              type: "主流程",
              apply() {
                state.currentPage = "analysis";
                state.navMode = "analysis";
                syncSelectionFromConversation(conversation);
              }
            };
          }

          case "openConversation": {
            const conversation = findConversation(context.conversationId);

            return {
              label: `打开会话：${conversation.title}`,
              targetPage: "analysis",
              targetLabel: "Analysis",
              reason: "查看当前 Workspace 内的历史 Conversation / Message。",
              type: "查看详情",
              apply() {
                state.currentPage = "analysis";
                state.navMode = "analysis";
                syncSelectionFromConversation(conversation);
              }
            };
          }

          case "openRunTrace": {
            const run = runDetails[context.runId];

            return {
              label: "查看运行轨迹",
              targetPage: "observability",
              targetLabel: "Observability",
              reason: "定位 runId，查看 Run / Trace / ToolCall / ModelCall 详情。",
              type: "查看详情",
              apply() {
                state.currentPage = "observability";
                state.navMode = "global";
                syncSelectionFromRun(run);
              }
            };
          }

          case "openReport": {
            const report = findReport(context.reportId);
            const run = runDetails[report.runId];

            return {
              label: "查看 / 生成报告",
              targetPage: "reports",
              targetLabel: "Reports",
              reason: "从当前分析进入 Report 阅读与决策沉淀。",
              type: "查看详情",
              apply() {
                state.currentPage = "reports";
                state.navMode = "reports";
                state.reportFilter = "all";
                state.selectedReportId = report.reportId;
                state.selectedRunId = report.runId;
                if (report.sourceEvidence.length > 0) {
                  state.selectedSourceEvidenceId = report.sourceEvidence[0];
                }
                if (run) {
                  state.selectedMetricId = run.metricId;
                  state.selectedModelConfigId = run.modelConfigId;
                }
              }
            };
          }

          case "openEvidence": {
            const evidence = findSourceEvidence(context.sourceEvidenceId);

            return {
              label: "查看证据来源",
              targetPage: "dataKnowledge",
              targetLabel: "Data & Knowledge",
              reason: "打开 SourceEvidence，回看 DataSource / KnowledgeDocument。",
              type: "上下文引用",
              apply() {
                state.currentPage = "dataKnowledge";
                state.navMode = "global";
                state.selectedSourceEvidenceId = evidence.sourceEvidenceId;
              }
            };
          }

          case "openMetric": {
            const metric = findMetric(context.metricId);

            return {
              label: "查看指标口径",
              targetPage: "metrics",
              targetLabel: "Metrics",
              reason: "打开 Metric / Threshold / Lineage，解释指标定义与异常规则。",
              type: "查看详情",
              apply() {
                state.currentPage = "metrics";
                state.navMode = "global";
                state.selectedMetricId = metric.metricId;
              }
            };
          }

          case "openModelTools": {
            const modelConfigId = context.modelConfigId || state.selectedModelConfigId;

            return {
              label: "查看模型工具配置",
              targetPage: "modelTools",
              targetLabel: "Models & Tools",
              reason: "查看 Model / Prompt / Tool / RAG Strategy 和权限摘要。",
              type: "配置入口",
              apply() {
                state.currentPage = "modelTools";
                state.navMode = "global";
                state.selectedModelConfigId = modelConfigId;
              }
            };
          }

          case "openPlatformOps":
            return {
              label: "查看平台质量",
              targetPage: "platformOperations",
              targetLabel: "Platform Operations",
              reason: "查看数据质量与平台状态，这一版只保留入口 / 占位。",
              type: "查看详情",
              apply() {
                state.currentPage = "platformOperations";
                state.navMode = "global";
              }
            };

          case "openFeedback":
            return {
              label: "打开反馈入口",
              targetPage: "feedback",
              targetLabel: "Feedback",
              reason: "把本次分析结果送入质量闭环，但不与 Evaluation / Memory 混用。",
              type: "查看详情",
              apply() {
                state.currentPage = "feedback";
                state.navMode = "global";
              }
            };

          case "returnGlobalNav":
            return {
              label: "返回主导航",
              targetPage: state.currentPage,
              targetLabel: pageMeta[state.currentPage].title,
              reason: "恢复 Workspace + 主工作区 + 能力分组的全局导航视图。",
              type: "导航状态",
              apply() {
                state.navMode = "global";
              }
            };

          case "setReportFilter":
            return {
              label: `筛选：${reportFilterOptions.find((item) => item.id === context.filter)?.label || "全部"}`,
              targetPage: "reports",
              targetLabel: "Reports",
              reason: "切换 Reports 模块内列表筛选。",
              type: "模块内导航",
              apply() {
                const visibleReports = getReportsByFilter(context.filter);
                state.currentPage = "reports";
                state.navMode = "reports";
                state.reportFilter = context.filter;
                if (visibleReports.length > 0) {
                  state.selectedReportId = visibleReports[0].reportId;
                  state.selectedRunId = visibleReports[0].runId;
                }
              }
            };

          case "switchWorkspace":
            return {
              label: "切换空间",
              targetPage: "workspaceManagement",
              targetLabel: "Workspace 管理",
              reason: "这里只作为切换空间的占位入口，不实现真实空间切换。",
              type: "配置入口",
              apply() {
                state.currentPage = "workspaceManagement";
                state.navMode = "global";
              }
            };

          default:
            return null;
        }
      }

      function performAction(actionId, context = {}) {
        const action = buildAction(actionId, context);

        if (!action) {
          return;
        }

        action.apply();
        state.inspectorEntry = {
          label: action.label,
          targetLabel: action.targetLabel,
          reason: action.reason,
          type: action.type
        };
        renderApp();
      }

      function statusTag(status) {
        const classMap = {
          completed: "status-completed",
          running: "status-running",
          failed: "status-failed",
          succeeded: "status-completed"
        };

        return `<span class="tag ${classMap[status] || "status-running"}">${status}</span>`;
      }

      function riskTag(riskLevel) {
        return `<span class="tag risk-${riskLevel || "low"}">${riskLevel}</span>`;
      }

      function actionMarkup(actionId, context = {}, variant = "ghost") {
        const action = buildAction(actionId, context);
        const entries = Object.entries(context)
          .map(
            ([key, value]) =>
              `data-${key.replace(/[A-Z]/g, (letter) => `-${letter.toLowerCase()}`)}="${value}"`
          )
          .join(" ");

        const buttonClass = variant === "primary" ? "action-button" : "ghost-button";

        return `
          <div class="entry-card">
            <div class="entry-row">
              <button class="${buttonClass}" data-action="${actionId}" ${entries}>${action.label}</button>
              <span class="entry-meta"><strong>Target</strong> ${action.targetLabel}</span>
              <span class="entry-meta"><strong>Reason</strong> ${action.reason}</span>
              <span class="entry-meta"><strong>Type</strong> ${action.type}</span>
            </div>
          </div>
        `;
      }

      function renderGlobalSidebar() {
        const groupsMarkup = getFilteredGlobalNavGroups()
          .map((group) => {
            const buttons = group.items
              .map((item) => {
                const meta = pageMeta[item.page];

                return `
                  <button class="nav-button ${state.currentPage === item.page ? "active" : ""}" data-action="openPage" data-page="${item.page}">
                    <strong>${meta.title}</strong>
                    <span class="nav-caption">${item.caption}</span>
                    <span class="nav-meta">Target: ${meta.title} · Type: ${item.type}</span>
                  </button>
                `;
              })
              .join("");

            return `
              <section class="nav-group ${group.featured ? "featured" : ""}">
                <h3>${group.label}</h3>
                ${group.copy ? `<p class="nav-group-copy">${group.copy}</p>` : ""}
                ${buttons}
              </section>
            `;
          })
          .join("");

        return `
          <div class="brand">
            <span class="brand-kicker">Issue #114 · LeftNav Prototype</span>
            <p>全局导航采用 Workspace 顶部上下文 + 主工作区 + 能力分组，Analysis / Reports 再进入模块内导航。</p>
          </div>

          <section class="workspace-chip">
            <span class="label">当前 Workspace</span>
            <h2>${workspace.name}</h2>
            <p>${workspace.businessDomain}</p>
            <div class="chip-row" style="margin-top: 12px;">
              <span class="chip"><strong>Role</strong> ${workspace.role}</span>
              <span class="chip"><strong>workspaceId</strong> ${workspace.workspaceId}</span>
            </div>
            <div class="workspace-actions" style="margin-top: 14px;">
              <button class="workspace-action-button" data-action="openPage" data-page="workspaceManagement">Workspace 管理</button>
              <button class="workspace-action-button" data-action="switchWorkspace">切换空间</button>
            </div>
          </section>

          <div class="sidebar-search-wrap">
            <input
              class="sidebar-search"
              type="search"
              placeholder="Search..."
              value="${state.globalSearch}"
              data-input-model="globalSearch"
            />
          </div>

          ${groupsMarkup}
        `;
      }

      function renderAnalysisSidebar() {
        const visibleConversations = getAnalysisNavConversations();

        return `
          <div class="brand">
            <span class="brand-kicker">Workspace Context</span>

          </div>

          <section class="workspace-chip compact">
            <h2>${workspace.name}</h2>
            <div class="chip-row" style="margin-top: 10px;">
              <span class="chip"><strong>Domain</strong> ${workspace.businessDomain}</span>
              <span class="chip"><strong>Role</strong> ${workspace.role}</span>
            </div>
          </section>

          <div class="module-nav-header">

            <div class="sidebar-search-wrap" style="margin-top: 14px;">

                data-input-model="analysisSearch"

          <section class="nav-group">

            <p class="nav-list-note">点击左侧会话切换主区域中的 Conversation。</p>
            ${visibleConversations

        if (state.navMode === "analysis") {
          return renderAnalysisSidebar();

        if (state.navMode === "reports") {

      function renderFlowStrip() {
        const flow = [
          {
            title: "Workspace",
            copy: "最上层容器"
          },
          {
            title: "Finding",
            copy: "Dashboard 识别的问题"
          },
          {
            title: "Conversation",
            copy: "Analysis 中的分析过程"
          },
          {
            title: "Message / Turn",
            copy: "多轮对话上下文"
          },
          {
            title: "Run",
            copy: "Assistant 回复背后的执行记录"
          },
          {
            title: "Trace / Evidence / Report",
            copy: "详情、依据与沉淀"
          },
          {
            title: "Feedback / Evaluation",
            copy: "质量闭环"
          }
        ];

        return flow
          .map((item, index) => {
            const activeMap = {
              workspace: [0],
              dashboard: [0, 1],
              analysis: [0, 1, 2, 3, 4, 5],

              reports: [5],

            return `

                <strong>${item.title}</strong>
                <span class="muted">${item.copy}</span>

          .join("");

                <span class="chip"><strong>Current Workspace</strong> ${workspace.name}</span>

        const messages = conversation.messages
          .map((message) => {
            const runSummary = message.runSummary

                </div>
              </article>
            </div>
            <div class="fact-grid" style="margin-top: 16px;">
              ${dataKnowledge.qualityChecks
                .map(
                  (item) => `
                    <article class="fact-card">
                      <span class="label">Data Quality</span>
                      <h4>${item.job}</h4>
                      <p>${item.summary}</p>
                      <div class="meta-row" style="margin-top: 12px;">
                        ${statusTag(item.status === "passed" ? "completed" : "running")}
                      </div>
                    </article>
                  `
                )
                .join("")}
            </div>
          </section>

          ${renderBoundaryCards("dataKnowledge")}
        `;
      }

      function renderMetricsPage() {
        const metric = getSelectedMetric();

        return `
          ${renderPageHeader("metrics")}

          <section class="section panel">
            <div class="section-head">
              <div>
                <h3 class="section-title">指标口径、阈值与血缘</h3>
                <p class="section-copy">Metrics 页面负责回答“这个指标是怎么算的、为什么触发异常、它依赖哪些数据”。</p>
              </div>
            </div>
            <div class="page-grid" style="margin-bottom: 18px;">
              ${metrics
                .map(
                  (item) => `
                    <article class="content-card">
                      <div class="meta-row" style="justify-content: space-between; align-items: center; margin-bottom: 10px;">
                        <h4 style="margin: 0;">${item.name}</h4>
                        ${riskTag(item.threshold.riskLevel)}
                      </div>
                      <p>${item.threshold.rule}</p>
                      <div class="chip-row" style="margin-top: 12px;">
                        <span class="chip"><strong>metricId</strong> ${item.metricId}</span>
                      </div>
                      <div class="action-stack" style="margin-top: 14px;">
                        ${actionMarkup("openMetric", { metricId: item.metricId })}
                      </div>
                    </article>
                  `
                )
                .join("")}
            </div>
            <div class="page-grid">
              <article class="content-card">
                <span class="label">Metric</span>
                <h4>${metric.name}</h4>
                <p><strong>metricId：</strong>${metric.metricId}</p>
                <p style="margin-top: 10px;"><strong>口径：</strong>${metric.formula}</p>
              </article>
              <article class="content-card">
                <span class="label">MetricThreshold</span>
                <h4>${metric.threshold.rule}</h4>
                <div class="chip-row" style="margin-top: 14px;">
                  <span class="chip"><strong>metricThresholdId</strong> ${metric.threshold.metricThresholdId}</span>
                  ${riskTag(metric.threshold.riskLevel)}
                </div>
              </article>
              <article class="content-card">
                <span class="label">MetricLineage</span>
                <ul class="soft-list">
                  ${metric.lineage.map((item) => `<li>${item}</li>`).join("")}
                </ul>
              </article>
              <article class="content-card">
                <span class="label">异常规则</span>
                <ul class="soft-list">
                  ${metric.anomalyRules.map((item) => `<li>${item}</li>`).join("")}
                </ul>
              </article>
            </div>
          </section>

          ${renderBoundaryCards("metrics")}
        `;
      }

      function renderModelToolsPage() {
        return `
          ${renderPageHeader("modelTools")}

          <section class="section panel">
            <div class="section-head">
              <div>
                <h3 class="section-title">模型、Prompt、Tool 与 RAG Strategy</h3>
                <p class="section-copy">Analysis 页面只链接到这里查看配置归属；真正的 Model / Prompt / Tool / RAG 定义集中在 Models & Tools。</p>
              </div>
            </div>
            <div class="page-grid">
              <article class="content-card">
                <span class="label">ModelConfig</span>
                <div class="table-list">
                  ${modelTools.modelConfigs
                    .map(
                      (item) => `
                        <article class="fact-card">
                          <h4>${item.provider} · ${item.modelId}</h4>
                          <p><strong>modelConfigId：</strong>${item.modelConfigId}</p>
                          <p style="margin-top: 8px;">${item.useCase}</p>
                        </article>
                      `
                    )
                    .join("")}
                </div>
              </article>
              <article class="content-card">
                <span class="label">PromptVersion</span>
                <div class="table-list">
                  ${modelTools.promptVersions
                    .map(
                      (item) => `
                        <article class="fact-card">
                          <h4>${item.name}</h4>
                          <div class="chip-row" style="margin-bottom: 10px;">
                            <span class="chip"><strong>version</strong> ${item.version}</span>
                          </div>
                          <p><strong>promptVersionId：</strong>${item.promptVersionId}</p>
                        </article>
                      `
                    )
                    .join("")}
                </div>
              </article>
              <article class="content-card">
                <span class="label">Tool Registry</span>
                <div class="table-list">
                  ${modelTools.toolDefinitions
                    .map(
                      (item) => `
                        <article class="fact-card">
                          <h4>${item.toolName}</h4>
                          <p>${item.description}</p>
                          <div class="chip-row" style="margin-top: 12px;">
                            ${riskTag(item.riskLevel)}
                            <span class="chip"><strong>Permission</strong> ${item.permission}</span>
                            <span class="chip"><strong>Timeout</strong> ${item.timeout}</span>
                          </div>
                        </article>
                      `
                    )
                    .join("")}
                </div>
              </article>
              <article class="content-card">
                <span class="label">RAG Strategy / Permission Summary</span>
                <h4>${modelTools.ragStrategies[0].name}</h4>
                <p>${modelTools.ragStrategies[0].summary}</p>
                <ul class="soft-list" style="margin-top: 14px;">
                  ${modelTools.permissions.map((item) => `<li>${item}</li>`).join("")}
                </ul>
                <div class="action-stack" style="margin-top: 16px;">
                  ${actionMarkup("openPage", { page: "governance" })}
                </div>
              </article>
            </div>
          </section>

          ${renderBoundaryCards("modelTools")}
        `;
      }

      function renderPlaceholderPage(pageKey) {
        const meta = pageMeta[pageKey];

        return `
          ${renderPageHeader(pageKey)}

          <section class="section panel">
            <div class="section-head">
              <div>
                <h3 class="section-title">入口 / 占位</h3>
                <p class="section-copy">第一版只明确这个模块的归属与入口，不展开复杂页面，以避免把主链路打散。</p>
              </div>
            </div>
            <div class="placeholder-note">
              <p><strong>${meta.title}</strong> 当前只作为入口 / 占位存在，用于说明对象归属、导航位置和与主流程的关系。</p>
            </div>
            <div class="page-grid" style="margin-top: 16px;">
              <article class="fact-card">
                <span class="label">主对象</span>
                <div class="chip-row">
                  ${meta.objects.map((item) => `<span class="chip"><strong>Object</strong> ${item}</span>`).join("")}
                </div>
              </article>
              <article class="fact-card">
                <span class="label">为什么先做入口</span>
                <p>${meta.responsibility}</p>
              </article>
            </div>
          </section>

          ${renderBoundaryCards(pageKey)}
        `;
      }

      function renderEntryLandingPage(pageKey, entryLabel, items) {
        const meta = pageMeta[pageKey];

        return `
          ${renderPageHeader(pageKey)}

          <section class="section panel">
            <div class="section-head">
              <div>
                <h3 class="section-title">${entryLabel}</h3>
                <p class="section-copy">${meta.responsibility}</p>
              </div>
            </div>
            <div class="page-grid">
              ${items
                .map(
                  (item) => `
                    <article class="content-card">
                      <span class="label">${meta.title}</span>
                      <h4>${item}</h4>
                      <p>这里只做入口 / 占位，用来说明该模块在全局导航中的归属，不实现真实系统能力。</p>
                    </article>
                  `
                )
                .join("")}
            </div>
          </section>

          ${renderBoundaryCards(pageKey)}
        `;
      }

      function renderPage() {
        switch (state.currentPage) {
          case "workspace":
            return renderWorkspacePage();
          case "dashboard":
            return renderDashboardPage();
          case "analysis":
            return renderAnalysisPage();
          case "reports":
            return renderReportsPage();
          case "observability":
            return renderObservabilityPage();
          case "dataKnowledge":
            return renderDataKnowledgePage();
          case "metrics":
            return renderMetricsPage();
          case "feedback":
            return renderEntryLandingPage("feedback", "反馈管理入口", landingEntries.feedback);
          case "evaluation":
            return renderEntryLandingPage(
              "evaluation",
              "Evaluation 入口",
              landingEntries.evaluation
            );
          case "platformOperations":
            return renderEntryLandingPage(
              "platformOperations",
              "平台运行与质量入口",
              landingEntries.platformOperations
            );
          case "modelTools":
            return renderModelToolsPage();
          case "governance":
          case "memory":
          case "settings":
          case "workspaceManagement":
            return renderPlaceholderPage(state.currentPage);
          default:
            return renderWorkspacePage();
        }
      }

      function renderInspector() {
        const meta = pageMeta[state.currentPage];
        const finding = findFinding(state.selectedFindingId);
        const conversation = getSelectedConversation();
        const run = getSelectedRun();
        const report = findReport(state.selectedReportId);
        const evidence = getSelectedEvidence();
        const metric = getSelectedMetric();
        const modelConfig = getSelectedModelConfig();

        return `
          <div>
            <span class="brand-kicker">Inspector</span>
            <h2 class="inspector-title">${meta.title}</h2>
            <p class="page-subtitle">${meta.hero}</p>
          </div>

          <div class="inspector-block">
            <div class="inspector-card">
              <span class="label">最近入口</span>
              <h4>${state.inspectorEntry.label}</h4>
              <div class="fact-grid" style="grid-template-columns: 1fr; margin-top: 14px;">
                <div class="fact-card">
                  <span class="label">Target</span>
                  <p>${state.inspectorEntry.targetLabel}</p>
                </div>
                <div class="fact-card">
                  <span class="label">Reason</span>
                  <p>${state.inspectorEntry.reason}</p>
                </div>
                <div class="fact-card">
                  <span class="label">Type</span>
                  <p>${state.inspectorEntry.type}</p>
                </div>
              </div>
            </div>
          </div>

          <div class="inspector-block">
            <div class="inspector-card">
              <span class="label">当前对象快照</span>
              <div class="ids-grid">
                <code>navMode: ${state.navMode}</code>
                <code>workspaceId: ${workspace.workspaceId}</code>
                <code>findingId: ${finding ? finding.findingId : "n/a"}</code>
                <code>conversationId: ${conversation.conversationId}</code>
                <code>runId: ${run.runId}</code>
                <code>reportId: ${report ? report.reportId : "n/a"}</code>
                <code>sourceEvidenceId: ${evidence.sourceEvidenceId}</code>
                <code>metricId: ${metric.metricId}</code>
                <code>modelConfigId: ${modelConfig.modelConfigId}</code>
              </div>
            </div>
          </div>

          <div class="inspector-block">
            <div class="inspector-card">
              <span class="label">对象语义</span>
              <ul class="tight-list">
                <li><strong>Finding</strong> 是问题，不等于 Conversation。</li>
                <li><strong>Conversation</strong> 是分析过程，<strong>Message / Turn</strong> 是多轮对话。</li>
                <li><strong>Run</strong> 是后台执行记录，<strong>Trace</strong> 是执行详情。</li>
                <li><strong>Evidence</strong> 是结论依据，<strong>Report</strong> 是结果沉淀。</li>
                <li><strong>Feedback / Evaluation</strong> 是质量闭环，不和 Memory 混用。</li>
              </ul>
            </div>
          </div>

          <div class="inspector-block">
            <div class="inspector-card">
              <span class="label">Prototype Boundaries</span>
              <ul class="tight-list">
                <li>单文件 HTML + CSS + 少量原生 JavaScript。</li>
                <li>不接真实 API / DB / Agent Run / 模型调用 / RAG / Evaluation。</li>
                <li>不定义正式 React 组件结构，不定义 API / DB / contracts。</li>
                <li>正式实现仍需回到 AGENTS.md、docs/ui-design.md、docs/architecture.md、docs/contracts.md 和 packages/contracts。</li>
              </ul>
            </div>
          </div>
        `;
      }

      function renderApp() {
        document.getElementById("sidebar-root").innerHTML = renderSidebar();
        document.getElementById("page-root").innerHTML = renderPage();
        document.getElementById("inspector-root").innerHTML = renderInspector();
      }

      document.addEventListener("click", (event) => {
        const target = event.target.closest("[data-action]");

        if (!target) {
          return;
        }

        const context = {};

        Object.entries(target.dataset).forEach(([key, value]) => {
          if (key !== "action") {
            context[key] = value;
          }
        });

        performAction(target.dataset.action, context);
      });

      document.addEventListener("input", (event) => {
        const target = event.target.closest("[data-input-model]");

        if (!target) {
          return;
        }

        state[target.dataset.inputModel] = target.value;
        renderApp();
      });

      renderApp();
    </script>
  </body>
</html>
