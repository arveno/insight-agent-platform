services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - /opt/insight-agent-platform/shared/data/mysql:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -uroot --password=$${MYSQL_ROOT_PASSWORD} --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - preview

  agent-runtime:
    build:
      context: ${AGENT_RUNTIME_BUILD_CONTEXT:-/opt/insight-agent-platform/current}
      dockerfile: ${AGENT_RUNTIME_DOCKERFILE:-deploy/docker/agent-runtime/Dockerfile}
      args:
        AGENT_RUNTIME_PYPI_INDEX_URL: ${AGENT_RUNTIME_PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    restart: unless-stopped
    env_file:
      - path: /opt/insight-agent-platform/env/model-provider.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${AGENT_RUNTIME_HOST_PORT:-8000}:8000"
    environment:
      APP_ENV: ${APP_ENV:-preview}
      IAP_AGENT_WORKER_POLL_INTERVAL_SECONDS: ${IAP_AGENT_WORKER_POLL_INTERVAL_SECONDS:-2}
      IAP_AGENT_WORKER_IDLE_LOG_INTERVAL_SECONDS: ${IAP_AGENT_WORKER_IDLE_LOG_INTERVAL_SECONDS:-30}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      AUTH_SESSION_COOKIE_SECURE: ${AUTH_SESSION_COOKIE_SECURE:-false}
      AUTH_SESSION_COOKIE_SAMESITE: ${AUTH_SESSION_COOKIE_SAMESITE:-lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://127.0.0.1:8000/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - preview

  agent-worker:
    build:
      context: ${AGENT_RUNTIME_BUILD_CONTEXT:-/opt/insight-agent-platform/current}
      dockerfile: ${AGENT_RUNTIME_DOCKERFILE:-deploy/docker/agent-runtime/Dockerfile}
      args:
        AGENT_RUNTIME_PYPI_INDEX_URL: ${AGENT_RUNTIME_PYPI_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
    command: ["python", "-m", "src.app.worker"]
    restart: unless-stopped
    env_file:
      - path: /opt/insight-agent-platform/env/model-provider.env
        required: false
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: ${APP_ENV:-preview}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      AUTH_SESSION_COOKIE_SECURE: ${AUTH_SESSION_COOKIE_SECURE:-false}
      AUTH_SESSION_COOKIE_SAMESITE: ${AUTH_SESSION_COOKIE_SAMESITE:-lax}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5173,http://localhost:5173}
    networks:
      - preview

  redis:
    image: ${REDIS_IMAGE:-redis:7}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - /opt/insight-agent-platform/shared/data/redis:/data
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - preview

  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - /opt/insight-agent-platform/deploy/docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${CADDY_SITE_ROOT}:/srv:ro
    networks:
      - preview

networks:
  preview:
    name: ${COMPOSE_PROJECT_NAME:-iap-ecs-preview}_network
    driver: bridge
