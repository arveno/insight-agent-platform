openapi: 3.1.0
info:
  title: Insight Agent Runtime API
  version: 0.1.0
  description: >
    Agent Runtime 服务的最小 OpenAPI 契约。该文档只定义 runtime contract surface，
    不代表后端 handler、worker、SSE 或真实模型/工具执行已经实现。
paths:
  /health:
    get:
      summary: 健康检查
      description: 返回 Agent Runtime 的基础健康状态，供 smoke test 和部署探活使用。
      operationId: getHealth
      responses:
        "200":
          description: Runtime 当前可响应健康检查。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /analysis-tasks:
    post:
      summary: 创建分析输入任务
      description: >
        创建一个新的 AnalysisTask 正式输入对象，承接用户 question 与 context pack，
        并绑定到既有 Conversation。
        成功时由服务端生成 canonical analysisTaskId，并写入真实 MySQL foundation repository。
      operationId: createAnalysisTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnalysisTaskRequest"
            example:
              conversationId: conversation-0c948fb61b8b4dfc95d81568c41c5a3f
              workspaceId: workspace-northstar-retail-china
              userId: user-zoe
              businessDomainId: business-domain-revenue-quality
              question: 解释华东区域收入增速低于阈值的主要原因，并给出下一步建议。
              contextPack:
                sourceType: metric
                sourceId: metric-recognized-revenue
                sourceTitle: 确认收入
                summary: 华东区域收入增速低于阈值，需要继续解释主因与下一步建议。
                chips:
                  - Revenue quality
                  - 2026 Q2
                  - 收入增速 < -2%
                suggestedPrompt: 解释华东区域收入增速低于阈值的主要原因，并给出下一步建议。
              title: 收入增速异常
      responses:
        "201":
          description: AnalysisTask 创建成功后的正式契约响应。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisTask"
              example:
                analysisTaskId: analysis-task-6d7a1a7097b34752ae5d5cb9b390bc0e
                conversationId: conversation-0c948fb61b8b4dfc95d81568c41c5a3f
                workspaceId: workspace-northstar-retail-china
                userId: user-zoe
                businessDomainId: business-domain-revenue-quality
                question: 解释华东区域收入增速低于阈值的主要原因，并给出下一步建议。
                contextPack:
                  sourceType: metric
                  sourceId: metric-recognized-revenue
                  sourceTitle: 确认收入
                  summary: 华东区域收入增速低于阈值，需要继续解释主因与下一步建议。
                  chips:
                    - Revenue quality
                    - 2026 Q2
                    - 收入增速 < -2%
                  suggestedPrompt: 解释华东区域收入增速低于阈值的主要原因，并给出下一步建议。
                createdAt: "2026-06-05T03:08:12Z"
                updatedAt: "2026-06-05T03:08:12Z"
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
        "409":
          $ref: "#/components/responses/RuntimeMismatch"
  /analysis-tasks/submit:
    post:
      summary: 提交 Analysis 草稿并进入正式运行主线
      description: >
        这是 #201-2 的唯一正式 submit orchestration entry。
        服务端在一次 transaction 内 create or reuse Conversation、
        create AnalysisTask with typed contextPack snapshot、
        create initial AnalysisRun、persist User Message，并更新 Conversation.currentRunId。
        前端不得改为拼接 lower-level POST /conversations、POST /analysis-tasks、POST /analysis-runs 或 message write path。
      operationId: submitAnalysisDraft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAnalysisDraftRequest"
            example:
              workspaceId: workspace-northstar-retail-china
              userId: user-zoe
              businessDomainId: business-domain-revenue-quality
              question: 解释华东区域收入增速低于阈值的主要原因，并给出下一步建议。
              contextPack:
                sourceType: metric
                sourceId: metric-recognized-revenue
                sourceTitle: 确认收入
                summary: 华东区域收入增速低于阈值，需要继续解释主因与下一步建议。
                chips:
                  - Revenue quality
                  - 2026 Q2
                  - 收入增速 < -2%
                suggestedPrompt: 解释华东区域收入增速低于阈值的主要原因，并给出下一步建议。
      responses:
        "201":
          description: Analysis draft submit 成功后的正式持久化对象链路。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmitAnalysisDraftResponse"
              example:
                conversation:
                  conversationId: conversation-0c948fb61b8b4dfc95d81568c41c5a3f
                  workspaceId: workspace-northstar-retail-china
                  userId: user-zoe
                  currentRunId: analysis-run-2c1ee63bc1a549e68c4780fe7a5bfb9a
                  title: 收入增速异常
                  status: active
                  createdAt: "2026-06-05T03:08:00Z"
                  updatedAt: "2026-06-05T03:08:12Z"
                analysisTask:
                  analysisTaskId: analysis-task-6d7a1a7097b34752ae5d5cb9b390bc0e
                  conversationId: conversation-0c948fb61b8b4dfc95d81568c41c5a3f
                  workspaceId: workspace-northstar-retail-china
                  userId: user-zoe
                  businessDomainId: business-domain-revenue-quality
                  question: 解释华东区域收入增速低于阈值的主要原因，并给出下一步建议。
                  contextPack:
                    sourceType: metric
                    sourceId: metric-recognized-revenue
                    sourceTitle: 确认收入
                    summary: 华东区域收入增速低于阈值，需要继续解释主因与下一步建议。
                    chips:
                      - Revenue quality
                      - 2026 Q2
                      - 收入增速 < -2%
                    suggestedPrompt: 解释华东区域收入增速低于阈值的主要原因，并给出下一步建议。
                  createdAt: "2026-06-05T03:08:12Z"
                  updatedAt: "2026-06-05T03:08:12Z"
                analysisRun:
                  runId: analysis-run-2c1ee63bc1a549e68c4780fe7a5bfb9a
                  workspaceId: workspace-northstar-retail-china
                  userId: user-zoe
                  analysisTaskId: analysis-task-6d7a1a7097b34752ae5d5cb9b390bc0e
                  status: created
                  phase: intake
                  outcome: null
                  waitingFor: null
                  createdAt: "2026-06-05T03:08:12Z"
                  validatingAt: null
                  queuedAt: null
                  startedAt: null
                  waitingSince: null
                  timeoutAt: null
                  cancelRequestedAt: null
                  cancellingAt: null
                  completedAt: null
                  failedAt: null
                  cancelledAt: null
                  expiredAt: null
                  rejectedAt: null
                  terminalReason: null
                  failureCode: null
                  retryable: true
                  retryOfRunId: null
                  originalRunId: null
                userMessage:
                  messageId: message-ec9981e33a0541dcb9f3fe2788fb14da
                  conversationId: conversation-0c948fb61b8b4dfc95d81568c41c5a3f
                  analysisTaskId: analysis-task-6d7a1a7097b34752ae5d5cb9b390bc0e
                  turnId: turn-6d7a1a7097b34752ae5d5cb9b390bc0e
                  runId: analysis-run-2c1ee63bc1a549e68c4780fe7a5bfb9a
                  role: user
                  content: 解释华东区域收入增速低于阈值的主要原因，并给出下一步建议。
                  status: completed
                  sourceEvidenceIds: []
                  toolCallIds: []
                  reportId: null
                  createdAt: "2026-06-05T03:08:12Z"
                  completedAt: "2026-06-05T03:08:12Z"
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
        "409":
          $ref: "#/components/responses/RuntimeMismatch"
  /conversations:
    post:
      summary: 创建会话
      description: >
        创建一个新的 Conversation thread container。
        Conversation 不拥有 singular analysisTaskId；后续 AnalysisTask 在提交时反向绑定到 Conversation。
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateConversationRequest"
            example:
              workspaceId: workspace-northstar-retail-china
              userId: user-zoe
              title: 收入增速异常
      responses:
        "201":
          description: Conversation 创建成功后的正式契约响应。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
              example:
                conversationId: conversation-0c948fb61b8b4dfc95d81568c41c5a3f
                workspaceId: workspace-northstar-retail-china
                userId: user-zoe
                currentRunId: null
                title: 收入增速异常
                status: active
                createdAt: "2026-06-05T03:08:20Z"
                updatedAt: "2026-06-05T03:08:20Z"
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
        "409":
          $ref: "#/components/responses/RuntimeMismatch"
  /conversations/{conversationId}:
    get:
      summary: 获取会话详情
      operationId: getConversation
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Conversation 详情。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
              example:
                conversationId: conversation-0c948fb61b8b4dfc95d81568c41c5a3f
                workspaceId: workspace-northstar-retail-china
                userId: user-zoe
                currentRunId: analysis-run-2c1ee63bc1a549e68c4780fe7a5bfb9a
                title: 收入增速异常
                status: active
                createdAt: "2026-06-05T03:08:20Z"
                updatedAt: "2026-06-05T03:08:30Z"
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
  /conversations/{conversationId}/messages:
    get:
      summary: 获取会话消息列表
      operationId: listConversationMessages
      parameters:
        - $ref: "#/components/parameters/ConversationId"
      responses:
        "200":
          description: Message 列表。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
              example:
                items:
                  - messageId: message-revenue-gap-q2-user
                    conversationId: conversation-revenue-gap-q2
                    analysisTaskId: analysis-task-revenue-gap-q2
                    turnId: turn-revenue-gap-q2-1
                    runId: analysis-q2-revenue-gap
                    role: user
                    content: 解释华东区域收入增速低于阈值的主要原因，并给出下一步建议。
                    status: completed
                    sourceEvidenceIds: []
                    toolCallIds: []
                    reportId: null
                    createdAt: "2026-06-05T11:08:12+08:00"
                    completedAt: "2026-06-05T11:08:12+08:00"
                  - messageId: message-revenue-gap-q2-assistant
                    conversationId: conversation-revenue-gap-q2
                    analysisTaskId: analysis-task-revenue-gap-q2
                    turnId: turn-revenue-gap-q2-1
                    runId: analysis-q2-revenue-gap
                    role: assistant
                    content: 收入增速下滑主要来自华东核心渠道确认延迟与促销库存错配，而不是整体价格体系失效。
                    status: completed
                    sourceEvidenceIds:
                      - source-evidence-channel-weekly-17
                      - source-evidence-inventory-note-east-04
                    toolCallIds:
                      - tool-call-analysis-q2-revenue-gap-metrics
                    reportId: report-revenue-gap-q2
                    createdAt: "2026-06-05T11:22:00+08:00"
                    completedAt: "2026-06-05T11:22:00+08:00"
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
  /conversations/{conversationId}/messages/{messageId}:
    get:
      summary: 获取单条消息
      operationId: getConversationMessage
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: Message 详情。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
              example:
                messageId: message-revenue-gap-q2-assistant
                conversationId: conversation-revenue-gap-q2
                analysisTaskId: analysis-task-revenue-gap-q2
                turnId: turn-revenue-gap-q2-1
                runId: analysis-q2-revenue-gap
                role: assistant
                content: 收入增速下滑主要来自华东核心渠道确认延迟与促销库存错配，而不是整体价格体系失效。
                status: completed
                sourceEvidenceIds:
                  - source-evidence-channel-weekly-17
                  - source-evidence-inventory-note-east-04
                toolCallIds:
                  - tool-call-analysis-q2-revenue-gap-metrics
                reportId: report-revenue-gap-q2
                createdAt: "2026-06-05T11:22:00+08:00"
                completedAt: "2026-06-05T11:22:00+08:00"
        "501":
          $ref: "#/components/responses/NotImplementedRuntimeRoute"
  /conversations/{conversationId}/messages/{messageId}/stream:
    get:
      summary: 获取消息流
      description: >
        `text/event-stream` 是 live MessageStream 的唯一实时传输方式。
        同一路径的 `application/json` 仅用于 snapshot / replay / history，
        不得替代 live streaming 主通道。`stream.completed` 不等于 `run.completed`。
      operationId: streamConversationMessage
      parameters:
        - $ref: "#/components/parameters/ConversationId"
        - $ref: "#/components/parameters/MessageId"
      responses:
        "200":
          description: MessageStream 的 live 或 replay contract surface。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageStreamList"
              example:
                items:
                  - messageStreamId: message-stream-revenue-gap-q2-0
                    conversationId: conversation-revenue-gap-q2
                    messageId: message-revenue-gap-q2-assistant
                    runId: analysis-q2-revenue-gap
                    sequence: 0
                    eventType: stream.started
                    delta: ""
                    status: created
                    occurredAt: "2026-06-05T11:22:00+08:00"
                    errorCode: null
                    errorMessage: null
                  - messageStreamId: message-stream-revenue-gap-q2-1
                    conversationId: conversation-revenue-gap-q2
                    messageId: message-revenue-gap-q2-assistant
                    runId: analysis-q2-revenue-gap
                    sequence: 1
                    eventType: stream.delta
                    delta: 收入增速下滑主要来自华东核心渠道确认延迟
                    status: streaming
                    occurredAt: "2026-06-05T11:23:00+08:00"
                    errorCode: null
                    errorMessage: null
                  - messageStreamId: message-stream-revenue-gap-q2-2
                    conversationId: conversation-revenue-gap-q2
                    messageId: message-revenue-gap-q2-assistant
                    runId: analysis-q2-revenue-gap
                    sequence: 2
                    eventType: stream.completed
                    delta: 与促销库存错配。
                    status: completed
                    occurredAt: "2026-06-05T11:24:00+08:00"
                    errorCode: null
                    errorMessage: null
            text/event-stream:
              schema:
                type: string
              example: |
                event: stream.started
                data: {"messageStreamId":"message-stream-revenue-gap-q2-0","conversationId":"conversation-revenue-gap-q2","messageId":"message-revenue-gap-q2-assistant","runId":"analysis-q2-revenue-gap","sequence":0,"eventType":"stream.started","delta":"","status":"created","occurredAt":"2026-06-05T11:22:00+08:00","errorCode":null,"errorMessage":null}

                event: stream.delta
                data: {"messageStreamId":"message-stream-revenue-gap-q2-1","conversationId":"conversation-revenue-gap-q2","messageId":"message-revenue-gap-q2-assistant","runId":"analysis-q2-revenue-gap","sequence":1,"eventType":"stream.delta","delta":"收入增速下滑主要来自华东核心渠道确认延迟","status":"streaming","occurredAt":"2026-06-05T11:23:00+08:00","errorCode":null,"errorMessage":null}

                event: stream.completed
                data: {"messageStreamId":"message-stream-revenue-gap-q2-2","conversationId":"conversation-revenue-gap-q2","messageId":"message-revenue-gap-q2-assistant","runId":"analysis-q2-revenue-gap","sequence":2,"eventType":"stream.completed","delta":"与促销库存错配。","status":"completed","occurredAt":"2026-06-05T11:24:00+08:00","errorCode":null,"errorMessage":null}
        "501":
          $ref: "#/components/responses/NotImplementedRuntimeRoute"
  /analysis-runs:
    post:
      summary: 创建分析运行
      description: >
        创建一次新的 AnalysisRun 契约对象，把 run 绑定到既有 analysisTaskId，
        并通过 AnalysisTask.conversationId 解析所属 Conversation，
        并 append 第一条 `run.created` 审计事件。
        该接口不写 Message、Report、ToolCall、ModelCall 或 SourceEvidence。
      operationId: createAnalysisRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAnalysisRunRequest"
            example:
              workspaceId: workspace-northstar-retail-china
              userId: user-zoe
              analysisTaskId: analysis-task-6d7a1a7097b34752ae5d5cb9b390bc0e
      responses:
        "201":
          description: AnalysisRun 创建成功后的正式契约响应。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
              example:
                runId: analysis-run-2c1ee63bc1a549e68c4780fe7a5bfb9a
                workspaceId: workspace-northstar-retail-china
                userId: user-zoe
                analysisTaskId: analysis-task-6d7a1a7097b34752ae5d5cb9b390bc0e
                status: created
                phase: intake
                outcome: null
                waitingFor: null
                createdAt: "2026-06-05T03:08:30Z"
                validatingAt: null
                queuedAt: null
                startedAt: null
                waitingSince: null
                timeoutAt: null
                cancelRequestedAt: null
                cancellingAt: null
                completedAt: null
                failedAt: null
                cancelledAt: null
                expiredAt: null
                rejectedAt: null
                terminalReason: null
                failureCode: null
                retryable: true
                retryOfRunId: null
                originalRunId: null
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
        "409":
          $ref: "#/components/responses/RuntimeMismatch"
  /analysis-runs/{runId}:
    get:
      summary: 获取分析运行详情
      operationId: getAnalysisRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "200":
          description: AnalysisRun 详情。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
              example:
                runId: analysis-run-2c1ee63bc1a549e68c4780fe7a5bfb9a
                workspaceId: workspace-northstar-retail-china
                userId: user-zoe
                analysisTaskId: analysis-task-6d7a1a7097b34752ae5d5cb9b390bc0e
                status: created
                phase: intake
                outcome: null
                waitingFor: null
                createdAt: "2026-06-05T03:08:30Z"
                validatingAt: null
                queuedAt: null
                startedAt: null
                waitingSince: null
                timeoutAt: null
                cancelRequestedAt: null
                cancellingAt: null
                completedAt: null
                failedAt: null
                cancelledAt: null
                expiredAt: null
                rejectedAt: null
                terminalReason: null
                failureCode: null
                retryable: true
                retryOfRunId: null
                originalRunId: null
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
  /analysis-runs/{runId}/dispatch:
    post:
      summary: 推进分析运行进入最小 dispatch foundation
      description: >
        把 `created/intake` 的 AnalysisRun 推进到 `queued/queueing`，
        创建一条真实 ExecutionAttempt，并 append 最小 lifecycle RunEvent 序列，
        为后续 #159 Worker / Queue / Dispatch 承接。
      operationId: dispatchAnalysisRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      responses:
        "202":
          description: 已完成最小 lifecycle 推进和 ExecutionAttempt 创建后的 AnalysisRun。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
              example:
                runId: analysis-run-2c1ee63bc1a549e68c4780fe7a5bfb9a
                workspaceId: workspace-northstar-retail-china
                userId: user-zoe
                analysisTaskId: analysis-task-6d7a1a7097b34752ae5d5cb9b390bc0e
                status: queued
                phase: queueing
                outcome: null
                waitingFor: null
                createdAt: "2026-06-05T03:08:30Z"
                validatingAt: "2026-06-05T03:08:35Z"
                queuedAt: "2026-06-05T03:08:35Z"
                startedAt: null
                waitingSince: null
                timeoutAt: null
                cancelRequestedAt: null
                cancellingAt: null
                completedAt: null
                failedAt: null
                cancelledAt: null
                expiredAt: null
                rejectedAt: null
                terminalReason: null
                failureCode: null
                retryable: true
                retryOfRunId: null
                originalRunId: null
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
        "409":
          $ref: "#/components/responses/RuntimeInvalidState"
  /analysis-runs/{runId}/worker-claim:
    post:
      summary: Worker claim 分析运行
      operationId: workerClaimAnalysisRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerClaimRequest"
            example:
              workerId: worker-runtime-dispatch-foundation
      responses:
        "202":
          description: Worker claim 成功后的 AnalysisRun。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisRun"
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
        "409":
          $ref: "#/components/responses/RuntimeInvalidState"
  /analysis-runs/{runId}/worker-heartbeat:
    post:
      summary: Worker heartbeat 分析运行
      operationId: workerHeartbeatAnalysisRun
      parameters:
        - $ref: "#/components/parameters/RunId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkerHeartbeatRequest"
            example:
              attemptId: attempt-7d60f811c53d447bb1c7e2c1d6445dd5
              workerId: worker-runtime-dispatch-foundation
      responses:
        "200":
          description: heartbeat 成功后的 ExecutionAttempt。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExecutionAttempt"
        "404":
          $ref: "#/components/responses/RuntimeNotFound"
        "409":
          $ref: "#/components/responses/RuntimeInvalidState"
  /analysis-runs/{runId}/worker-failure:
    post:
      summary: 记录 worker failure
      operationId: workerFailureAnalysisRun
      parameters:
