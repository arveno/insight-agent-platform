components:
  responses:
    NotImplementedRuntimeRoute:
      description: Runtime route stub is registered; real implementation is pending.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/NotImplementedErrorResponse"
          example:
            errorCode: NOT_IMPLEMENTED
            message: Runtime route stub is registered; real implementation is pending.
    RuntimeNotFound:
      description: Requested runtime foundation object was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeErrorResponse"
          example:
            errorCode: NOT_FOUND
            message: "AnalysisTask not found: analysis-task-missing"
    RuntimeMismatch:
      description: Request chain mismatched the persisted runtime foundation objects.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeErrorResponse"
          example:
            errorCode: MISMATCH
            message: Conversation.userId does not match request.userId
    RuntimeInvalidState:
      description: Requested lifecycle transition is not allowed for the persisted AnalysisRun state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/RuntimeErrorResponse"
          example:
            errorCode: INVALID_STATE
            message: AnalysisRun must be created/intake before dispatch.
  parameters:
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
      description: AnalysisRun 的 canonical runId。
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema:
        type: string
      description: ApprovalRequest 的 canonical approvalId。
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema:
        type: string
      description: Conversation 的 canonical conversationId。
    MessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
      description: Message 的 canonical messageId。
  schemas:
    HealthResponse:
      type: object
      description: 健康检查响应体。
      additionalProperties: false
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          description: 服务健康状态，当前占位只允许 ok。
          enum:
            - ok
        service:
          type: string
          description: 返回健康状态的后端服务名称。
        version:
          type: string
          description: 返回健康状态的后端服务版本。
    NotImplementedErrorResponse:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
      properties:
        errorCode:
          type: string
          enum:
            - NOT_IMPLEMENTED
        message:
          type: string
    RuntimeErrorResponse:
      type: object
      additionalProperties: false
      required:
        - errorCode
        - message
      properties:
        errorCode:
          type: string
          enum:
            - NOT_FOUND
            - MISMATCH
            - INVALID_STATE
        message:
          type: string
    CreateAnalysisTaskRequest:
      type: object
      additionalProperties: false
      required:
        - conversationId
        - workspaceId
        - userId
        - businessDomainId
        - question
        - contextPack
      properties:
        conversationId:
          type: string
        workspaceId:
          type: string
        userId:
          type: string
        businessDomainId:
          type: string
        question:
          type: string
        contextPack:
          anyOf:
            - $ref: "#/components/schemas/AnalysisTaskContextPack"
            - type: "null"
        title:
          description: Analysis 草稿态的建议标题输入，不替代正式 Conversation.title。
          type: string
    CreateConversationRequest:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - userId
        - title
      properties:
        workspaceId:
          type: string
        userId:
          type: string
        title:
          type: string
    CreateAnalysisRunRequest:
      type: object
      additionalProperties: false
      required:
        - workspaceId
        - userId
        - analysisTaskId
      properties:
        workspaceId:
          type: string
        userId:
          type: string
        analysisTaskId:
          type: string
    SubmitAnalysisDraftRequest:
      $ref: "../schemas/analysis/submit-analysis-draft-request.schema.json"
    SubmitAnalysisDraftResponse:
      $ref: "../schemas/analysis/submit-analysis-draft-response.schema.json"
    WorkerClaimRequest:
